generation_notes:
- Use English authority/deference controls and Korean honorifics or speech-level contrasts as the main XL surface.
- Keep request or event content stable while changing social deixis, formality, or status encoding.
- Separate addressee honorification, referent honorification, and speaker humility where possible.
- Do not generalize beyond Korean social-deixis realization; this is not a universal honorifics typology test.
- Avoid changing politeness into indirectness unless the contrast explicitly targets both.
- Reserve held-out status relations, speech levels, honorific markers, and deference templates for validation and test splits.
- 'Do not create bilingual basis/changed pairs: each generated pair should stay within the example''s declared language and
  surface_type; English and XL surfaces should be parallel subsets, not mixed inside one pair.'
- Do not use English authority/deference phrases and Korean speech levels as a single bilingual basis/changed pair; use them
  as parallel surfaces.
- Avoid stereotypes about age, gender, class, nationality, or occupation when constructing status relations.
