generation_notes:
- Use English controlled templates because the feature can be isolated with clause-frame changes.
- Keep the core event domain stable while changing the number and type of syntactic arguments.
- Do not allow lexical verb choice alone to determine valency; use alternating verbs where possible.
- Balance human, animal, organization, artifact, and abstract participants.
- Avoid examples where added adjuncts are mistaken for core arguments.
- Reserve held-out verb classes, argument structures, and lexical templates for validation and test splits.
